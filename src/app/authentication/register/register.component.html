<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="glass-card">

                <h2 class="mb-4 text-center">
                    Create Account
                </h2>

                <div class="mb-3">

                    <input
                    type="text"
                    class="form-control"
                    placeholder="Full Name">

                </div>

                <div class="mb-3">

                    <input
                    type="email"
                    class="form-control"
                    placeholder="Email">

                </div>

                <div class="mb-3">

                    <input
                    type="password"
                    class="form-control"
                    placeholder="Password">

                </div>

                <button class="gradient-btn">

                    Register

                </button>

            </div>

        </div>

    </div>

</div>
