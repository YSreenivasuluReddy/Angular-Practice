<h2>Delete Student Details</h2>

<p>Are you sure you want to delete this student?</p>

<div>
  <label>Student ID:</label>
  <input type="number" [value]="student.studentid" readonly />
</div>

<div>
  <label>Student Name:</label>
  <input type="text" [value]="student.studentname" readonly />
</div>

<div>
  <label>Student Email:</label>
  <input type="email" [value]="student.studentemail" readonly />
</div>

<button (click)="deleterecord()">Delete</button>
<button (click)="cancel()">Cancel</button>
