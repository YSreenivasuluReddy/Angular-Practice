<div class="container">
    <h3>Create Student Record</h3>

    <div class="create">
        <div class="form-group">
            <label>StudentId:</label>
            <input type="text" placeholder="Enter Student Id" id="studentid" name="studentid" [(ngModel)]="student.studentid"/>
        </div>
        <div class="form-group">
            <label>StudentName:</label>
            <input type="text" placeholder="Enter Student Name" id="studentname" name="studentname" [(ngModel)]="student.studentname" />
        </div>
        <div class="form-group">
            <label>StudentEmail:</label>
            <input type="email" placeholder="Enter Student Email" id="studentemail" name="studentemail" [(ngModel)] = "student.studentemail" />
        </div>
      <div class="button-container">
            <button (click)="create()">Save Record</button>
            <button routerLink="/read">Read</button>
      </div>

    </div>
</div>
