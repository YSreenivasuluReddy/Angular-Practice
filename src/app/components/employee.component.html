<h2>Employee Details</h2>

<table border="1" cellpadding="10">

  <tr>
    <th>Employee ID</th>
    <th>Employee Name</th>
    <th>Salary</th>
  </tr>

  @for (employee of employeeList; track employee.id) {
    <tr>
      <td>{{ employee.id }}</td>
      <td>{{ employee.name }}</td>
      <td>{{ employee.salary }}</td>
    </tr>
  }

</table>
